# Example: the baseline is recorded on the unfixed commit and committed as
# .failfirst.lock.json (by the agent or PR author BEFORE the fix); CI then verifies it.
name: failfirst
on: [pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./ # or pallav0107/failfirst@v0.1.2
        with:
          criteria: failfirst.yaml
